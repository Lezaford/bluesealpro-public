app = "bluesealpro"
primary_region = "iad"
console_command = "/rails/bin/rails console"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[deploy]
  release_command = "bin/rails db:migrate"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
